<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="100%" height="100%">
  <defs>
    <linearGradient id="arm-card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="arm-glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="arm-glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="arm-glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <filter id="pill-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
      @keyframes float-node {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .node-1 { animation: float-node 3s infinite ease-in-out; }
      .node-2 { animation: float-node 3.5s infinite ease-in-out 0.5s; }
      .node-3 { animation: float-node 4s infinite ease-in-out 1s; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="849" height="149" rx="12" fill="#080c14" stroke="url(#arm-card-border)" stroke-width="1"/>

  <!-- Top Title -->
  <text x="24" y="24" class="mono" font-size="9.5" font-weight="bold" fill="#38bdf8" letter-spacing="1.5">GALAXY.ARMS // TECHNICAL RADAR</text>
  <text x="826" y="24" text-anchor="end" class="mono" font-size="9" fill="#64748b" letter-spacing="1">SECTOR ALLOCATION: 3 ORBITS ACTIVE</text>

  <!-- Arm 1: Core Propulsion (Systems) -->
  <g transform="translate(20, 36)" class="node-1">
    <rect x="0" y="0" width="258" height="98" rx="8" fill="#0d1527" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="20" cy="24" r="5" fill="#00d4ff"/>
    <circle cx="20" cy="24" r="10" fill="url(#arm-glow-cyan)"/>
    <text x="34" y="27" class="mono" font-size="11" font-weight="bold" fill="#f1f5f9">ARM 01: SYSTEMS &amp; CORE</text>
    <text x="20" y="48" class="mono" font-size="9" fill="#64748b">Low-level execution &amp; algorithms</text>
    
    <!-- Tech Badges -->
    <rect x="18" y="60" width="46" height="22" rx="4" fill="#1e293b" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="41" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#00d4ff">C++</text>

    <rect x="70" y="60" width="88" height="22" rx="4" fill="#1e293b" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="114" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#38bdf8">Algorithms</text>

    <rect x="164" y="60" width="76" height="22" rx="4" fill="#1e293b" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="202" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#93c5fd">Systems</text>
  </g>

  <!-- Arm 2: Orbital Interface (Full Stack) -->
  <g transform="translate(296, 36)" class="node-2">
    <rect x="0" y="0" width="258" height="98" rx="8" fill="#111328" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="20" cy="24" r="5" fill="#c084fc"/>
    <circle cx="20" cy="24" r="10" fill="url(#arm-glow-purple)"/>
    <text x="34" y="27" class="mono" font-size="11" font-weight="bold" fill="#f1f5f9">ARM 02: FULL STACK &amp; AI</text>
    <text x="20" y="48" class="mono" font-size="9" fill="#64748b">Modern web apps &amp; intelligent flows</text>

    <!-- Tech Badges -->
    <rect x="18" y="60" width="84" height="22" rx="4" fill="#1e1b4b" stroke="#c084fc" stroke-width="0.5"/>
    <text x="60" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#c084fc">TypeScript</text>

    <rect x="108" y="60" width="58" height="22" rx="4" fill="#1e1b4b" stroke="#c084fc" stroke-width="0.5"/>
    <text x="137" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#e879f9">React</text>

    <rect x="172" y="60" width="70" height="22" rx="4" fill="#1e1b4b" stroke="#c084fc" stroke-width="0.5"/>
    <text x="207" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#a78bfa">Node.js</text>
  </g>

  <!-- Arm 3: Deep Space Infra (Cloud & DB) -->
  <g transform="translate(572, 36)" class="node-3">
    <rect x="0" y="0" width="258" height="98" rx="8" fill="#191522" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="20" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="20" cy="24" r="10" fill="url(#arm-glow-amber)"/>
    <text x="34" y="27" class="mono" font-size="11" font-weight="bold" fill="#f1f5f9">ARM 03: DATA &amp; INFRA</text>
    <text x="20" y="48" class="mono" font-size="9" fill="#64748b">Distributed storage &amp; containerization</text>

    <!-- Tech Badges -->
    <rect x="18" y="60" width="82" height="22" rx="4" fill="#292015" stroke="#fbbf24" stroke-width="0.5"/>
    <text x="59" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#fbbf24">PostgreSQL</text>

    <rect x="106" y="60" width="62" height="22" rx="4" fill="#292015" stroke="#fbbf24" stroke-width="0.5"/>
    <text x="137" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#fcd34d">Docker</text>

    <rect x="174" y="60" width="68" height="22" rx="4" fill="#292015" stroke="#fbbf24" stroke-width="0.5"/>
    <text x="208" y="74" text-anchor="middle" class="mono" font-size="9.5" font-weight="bold" fill="#f59e0b">Redis</text>
  </g>
</svg>
