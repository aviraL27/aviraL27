<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="100%" height="100%">
  <defs>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="cell-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="card-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
      @keyframes pulse-val {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #00d4ff); }
      }
      .metric-val { animation: pulse-val 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="849" height="129" rx="12" fill="#080c14" stroke="url(#card-border)" stroke-width="1.2"/>
  <rect x="1" y="1" width="848" height="128" rx="12" fill="url(#card-grid)"/>

  <!-- Top Status Bar -->
  <path d="M 12 0 L 220 0 L 208 22 L 12 22 Z" fill="#0f172a" fill-opacity="0.8"/>
  <text x="22" y="15" class="mono" font-size="9.5" font-weight="bold" fill="#38bdf8" letter-spacing="1.5">TELEMETRY.HUD // CORE DIRECTIVES</text>
  
  <text x="830" y="15" text-anchor="end" class="mono" font-size="9" fill="#64748b" letter-spacing="1">BANDWIDTH: 10 Gbps // PING: 4ms</text>

  <!-- 4 Telemetry Columns -->
  <!-- Cell 1: Role -->
  <g transform="translate(105, 75)">
    <circle cx="0" cy="-6" r="32" fill="url(#cell-glow)"/>
    <text x="0" y="-12" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">ROLE APPOINTMENT</text>
    <text x="0" y="12" text-anchor="middle" class="mono metric-val" font-size="15" font-weight="bold" fill="#38bdf8">Head of Tech Ops</text>
    <text x="0" y="28" text-anchor="middle" class="mono" font-size="9.5" fill="#a78bfa">@ Elevate</text>
  </g>

  <!-- Divider 1 -->
  <line x1="215" y1="40" x2="215" y2="105" stroke="#1e293b" stroke-width="1"/>

  <!-- Cell 2: Academics -->
  <g transform="translate(320, 75)">
    <circle cx="0" cy="-6" r="32" fill="url(#cell-glow)"/>
    <text x="0" y="-12" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">INSTITUTION</text>
    <text x="0" y="12" text-anchor="middle" class="mono metric-val" font-size="15" font-weight="bold" fill="#a78bfa">IIIT Nagpur</text>
    <text x="0" y="28" text-anchor="middle" class="mono" font-size="9.5" fill="#64748b">B.Tech Computer Science</text>
  </g>

  <!-- Divider 2 -->
  <line x1="425" y1="40" x2="425" y2="105" stroke="#1e293b" stroke-width="1"/>

  <!-- Cell 3: Systems Domain -->
  <g transform="translate(530, 75)">
    <circle cx="0" cy="-6" r="32" fill="url(#cell-glow)"/>
    <text x="0" y="-12" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">CORE DOMAIN</text>
    <text x="0" y="12" text-anchor="middle" class="mono metric-val" font-size="15" font-weight="bold" fill="#34d399">Systems &amp; AI Infra</text>
    <text x="0" y="28" text-anchor="middle" class="mono" font-size="9.5" fill="#64748b">Distributed &amp; Low-Level</text>
  </g>

  <!-- Divider 3 -->
  <line x1="635" y1="40" x2="635" y2="105" stroke="#1e293b" stroke-width="1"/>

  <!-- Cell 4: Operational Status -->
  <g transform="translate(740, 75)">
    <circle cx="0" cy="-6" r="32" fill="url(#cell-glow)"/>
    <text x="0" y="-12" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">BEACON STATUS</text>
    <text x="0" y="12" text-anchor="middle" class="mono metric-val" font-size="14" font-weight="bold" fill="#38bdf8">MISSION READY</text>
    <text x="0" y="28" text-anchor="middle" class="mono" font-size="9.5" fill="#10b981">All Systems Nominal</text>
  </g>
</svg>
