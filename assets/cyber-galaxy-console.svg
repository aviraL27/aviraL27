<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyber-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="panel-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="scan-laser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="galaxy-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0e172a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="radar-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="10" height="4" patternUnits="userSpaceOnUse">
      <rect width="10" height="1" fill="#00d4ff" opacity="0.035"/>
    </pattern>

    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-blink { animation: blink 1s infinite; }
      
      @keyframes live-pulse {
        0%, 100% { opacity: 0.4; r: 3.5; }
        50% { opacity: 1; r: 4.5; }
      }
      .beacon { animation: live-pulse 2s infinite ease-in-out; }

      @keyframes twinkle-slow {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.7; }
      }
      .star-s { animation: twinkle-slow 4s infinite ease-in-out; }

      @keyframes twinkle-fast {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.95; }
      }
      .star-f { animation: twinkle-fast 2.5s infinite ease-in-out; }

      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.9; }
        100% { transform: scale(0.95); opacity: 0.5; }
      }
      .orbit-ring { transform-origin: 184px 204px; animation: pulse-ring 4s infinite ease-in-out; }

      @keyframes meteor {
        0% { transform: translate(0, 0); opacity: 0; }
        10% { opacity: 1; }
        35% { transform: translate(-140px, 90px); opacity: 0; }
        100% { transform: translate(-140px, 90px); opacity: 0; }
      }
      .shooting-star { animation: meteor 6s infinite ease-in; }
    </style>
  </defs>

  <!-- 1. Background Void with Subtle Outer Border -->
  <rect x="0" y="0" width="850" height="380" rx="14" fill="#080c14"/>
  <rect x="0" y="0" width="850" height="380" rx="14" fill="url(#grid-pattern)" opacity="0.4"/>
  <rect x="0" y="0" width="850" height="380" rx="14" fill="url(#scanlines)"/>
  
  <!-- Outer Neon Border Stroke -->
  <rect x="1" y="1" width="848" height="378" rx="13" fill="none" stroke="url(#cyber-border)" stroke-width="1.5" opacity="0.85"/>

  <!-- 2. Terminal Titlebar Window Chrome -->
  <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 836 0 C 843.732 0 850 6.268 850 14 L 850 38 L 0 38 Z" fill="#0d1424" fill-opacity="0.95"/>
  <line x1="0" y1="38" x2="850" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="24" cy="19" r="5" fill="#EF4444"/>
  <circle cx="42" cy="19" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="19" r="5" fill="#10B981"/>

  <!-- Terminal Session Info -->
  <text x="425" y="24" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8" letter-spacing="0.5">
    <tspan fill="#38bdf8">aviral@cosmic-core</tspan>:<tspan fill="#a78bfa">~/orbital-station</tspan> (zsh) — 80x24
  </text>

  <!-- Live Telemetry Beacon (Right header) -->
  <g transform="translate(735, 19)">
    <circle cx="0" cy="0" r="4" fill="#10b981" class="beacon"/>
    <circle cx="0" cy="0" r="8" fill="#10b981" opacity="0.2"/>
    <text x="14" y="4" class="mono" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="1">LIVE ORBIT</text>
  </g>

  <!-- 3. Left Panel: Tactical Galaxy Radar / Core -->
  <g transform="translate(20, 52)">
    <!-- Panel Backdrop -->
    <rect x="0" y="0" width="330" height="306" rx="10" fill="#0b1120" fill-opacity="0.7" stroke="url(#panel-border)" stroke-width="1"/>
    
    <!-- Panel Header Tag -->
    <path d="M 12 0 L 170 0 L 160 20 L 12 20 Z" fill="#1e293b" fill-opacity="0.6"/>
    <text x="22" y="14" class="mono" font-size="9.5" font-weight="bold" fill="#38bdf8" letter-spacing="1.5">RADAR.SECTOR // 027</text>
    
    <!-- Coordinate HUD -->
    <text x="318" y="14" text-anchor="end" class="mono" font-size="9" fill="#64748b">LOC: 21.1458° N, 79.0882° E</text>

    <!-- Radar Sweep Center: (165, 160) -->
    <!-- Starfield Inside Radar -->
    <g>
      <circle cx="45" cy="65" r="1.2" fill="#ffffff" class="star-s"/>
      <circle cx="280" cy="55" r="1" fill="#38bdf8" class="star-f"/>
      <circle cx="70" cy="240" r="1.5" fill="#a78bfa" class="star-f"/>
      <circle cx="265" cy="235" r="1" fill="#ffffff" class="star-s"/>
      <circle cx="90" cy="110" r="0.8" fill="#38bdf8" opacity="0.6"/>
      <circle cx="240" cy="100" r="1.2" fill="#ffffff" class="star-s"/>
      <circle cx="130" cy="265" r="0.9" fill="#a78bfa" opacity="0.8"/>
      <circle cx="210" cy="270" r="1.1" fill="#38bdf8" class="star-f"/>
    </g>

    <!-- Shooting Star Streak -->
    <g class="shooting-star" transform="translate(290, 70)">
      <line x1="0" y1="0" x2="30" y2="-20" stroke="url(#radar-beam)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Concentric Target Radar Rings -->
    <circle cx="165" cy="160" r="120" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3 4"/>
    <circle cx="165" cy="160" r="85" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.25" stroke-dasharray="6 3"/>
    <circle cx="165" cy="160" r="50" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>
    <line x1="45" y1="160" x2="285" y2="160" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="165" y1="40" x2="165" y2="280" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 3"/>

    <!-- Galaxy Nebula Haze -->
    <circle cx="165" cy="160" r="95" fill="url(#galaxy-haze)"/>

    <!-- Rotating Spiral Galaxy Arms -->
    <g>
      <!-- Arm 1 (Cyan) -->
      <path d="M 165 160 Q 200 130 235 155 T 265 210" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.75" filter="url(#subtle-glow)"/>
      <circle cx="235" cy="155" r="2.5" fill="#00d4ff" filter="url(#subtle-glow)"/>
      <circle cx="265" cy="210" r="2" fill="#38bdf8"/>

      <!-- Arm 2 (Violet) -->
      <path d="M 165 160 Q 130 190 95 165 T 65 110" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.75" filter="url(#subtle-glow)"/>
      <circle cx="95" cy="165" r="2.5" fill="#a78bfa" filter="url(#subtle-glow)"/>
      <circle cx="65" cy="110" r="2" fill="#c084fc"/>

      <!-- Arm 3 (Amber / Green) -->
      <path d="M 165 160 Q 185 205 155 240 T 115 255" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.7"/>
      <circle cx="155" cy="240" r="2" fill="#fbbf24"/>
      
      <animateTransform attributeName="transform" type="rotate" from="0 165 160" to="360 165 160" dur="36s" repeatCount="indefinite"/>
    </g>

    <!-- Radar Sweep Line -->
    <g>
      <line x1="165" y1="160" x2="285" y2="160" stroke="#00d4ff" stroke-width="1.5" opacity="0.8" filter="url(#subtle-glow)"/>
      <polygon points="165,160 285,160 280,125" fill="url(#radar-beam)" opacity="0.25"/>
      <animateTransform attributeName="transform" type="rotate" from="0 165 160" to="360 165 160" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- Pulsing Galaxy Core -->
    <ellipse cx="165" cy="160" rx="26" ry="24" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.6" stroke-dasharray="4 2" class="orbit-ring"/>
    <circle cx="165" cy="160" r="16" fill="#080c14" stroke="#a78bfa" stroke-width="1.5" filter="url(#subtle-glow)"/>
    <circle cx="165" cy="160" r="10" fill="url(#core-glow)"/>
    <text x="165" y="165" text-anchor="middle" class="mono" font-size="14" font-weight="900" fill="#00d4ff">A</text>

    <!-- Sub-label -->
    <text x="165" y="294" text-anchor="middle" class="mono" font-size="9" fill="#00d4ff" letter-spacing="2" opacity="0.85">● SCANNING CONSTELLATIONS ●</text>
  </g>

  <!-- 4. Right Panel: Neofetch / Terminal Diagnostics HUD -->
  <g transform="translate(365, 52)">
    <!-- Panel Backdrop -->
    <rect x="0" y="0" width="465" height="306" rx="10" fill="#0b1120" fill-opacity="0.8" stroke="url(#panel-border)" stroke-width="1"/>

    <!-- Panel Header Tag -->
    <path d="M 12 0 L 210 0 L 198 20 L 12 20 Z" fill="#1e293b" fill-opacity="0.6"/>
    <text x="22" y="14" class="mono" font-size="9.5" font-weight="bold" fill="#a78bfa" letter-spacing="1.5">TELEMETRY.HUD // AGENT.SYS</text>
    <text x="450" y="14" text-anchor="end" class="mono" font-size="9" fill="#10b981">● PROTOCOL_200_OK</text>

    <!-- Console Text Terminal Contents -->
    <g transform="translate(24, 46)" class="mono" font-size="12" letter-spacing="0.3">
      <!-- Command Input -->
      <text x="0" y="0">
        <tspan fill="#10b981" font-weight="bold">guest@terminal</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#e2e8f0">$ ./fetch_operator_profile --verbose</tspan>
      </text>

      <line x1="0" y1="12" x2="415" y2="12" stroke="#1e293b" stroke-width="1"/>

      <!-- Specs Rows -->
      <text x="0" y="32" fill="#64748b">OPERATOR      <tspan fill="#94a3b8">::</tspan> <tspan fill="#f1f5f9" font-weight="bold">Aviral Joshi</tspan> <tspan fill="#38bdf8">(@aviraL27)</tspan></text>
      
      <text x="0" y="54" fill="#64748b">ACADEMICS     <tspan fill="#94a3b8">::</tspan> <tspan fill="#a78bfa">IIIT Nagpur</tspan> <tspan fill="#94a3b8">— B.Tech in Computer Science</tspan></text>
      
      <text x="0" y="76" fill="#64748b">APPOINTMENT   <tspan fill="#94a3b8">::</tspan> <tspan fill="#34d399" font-weight="bold">Head of Technical Operations</tspan> <tspan fill="#94a3b8">@ Elevate</tspan></text>
      
      <text x="0" y="98" fill="#64748b">GALAXY SECTORS<tspan fill="#94a3b8">::</tspan> <tspan fill="#38bdf8">AI Agents</tspan> · <tspan fill="#c084fc">Full-Stack</tspan> · <tspan fill="#fbbf24">Cloud Infra</tspan></text>

      <text x="0" y="120" fill="#64748b">SYS WEAPONS   <tspan fill="#94a3b8">::</tspan> <tspan fill="#f87171">C++</tspan> · <tspan fill="#38bdf8">TypeScript</tspan> · <tspan fill="#4ade80">Node.js</tspan> · <tspan fill="#60a5fa">React</tspan></text>

      <text x="0" y="142" fill="#64748b">DATA FABRIC   <tspan fill="#94a3b8">::</tspan> <tspan fill="#93c5fd">PostgreSQL</tspan> · <tspan fill="#34d399">Supabase</tspan> · <tspan fill="#f43f5e">Redis</tspan> · <tspan fill="#38bdf8">Docker</tspan></text>

      <text x="0" y="164" fill="#64748b">PASSIONS      <tspan fill="#94a3b8">::</tspan> <tspan fill="#f1f5f9">Building Systems · Sound Engineering · Gym</tspan></text>

      <text x="0" y="186" fill="#64748b">STATUS        <tspan fill="#94a3b8">::</tspan> <tspan fill="#34d399">🟢 ONLINE</tspan> <tspan fill="#64748b">|</tspan> <tspan fill="#38bdf8">All Systems Nominal</tspan></text>

      <line x1="0" y1="202" x2="415" y2="202" stroke="#1e293b" stroke-width="1"/>

      <!-- Interactive Execution Line with Blinking Block Cursor -->
      <text x="0" y="222">
        <tspan fill="#10b981">aviral@station</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~/projects</tspan><tspan fill="#e2e8f0">$ ./initiate_orbit --target=star-cluster</tspan>
      </text>
      
      <!-- Blinking Cursor Rect -->
      <rect x="362" y="210" width="8" height="15" fill="#00d4ff" class="cursor-blink"/>
    </g>

    <!-- Memory / Sub-status bar -->
    <g transform="translate(24, 286)" class="mono" font-size="9" fill="#475569">
      <text x="0" y="0">CPU: 8C/16T @ 4.5GHz</text>
      <text x="140" y="0">GPU: RTX 4050 [ACTIVE]</text>
      <text x="310" y="0">UPTIME: 100% NOMINAL</text>
    </g>
  </g>

  <!-- 5. Vertical Scanning Laser Beam Effect -->
  <rect x="2" y="-60" width="846" height="50" fill="url(#scan-laser)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0 -50" to="0 440" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
